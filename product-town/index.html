function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;jet.scale.y=1.5+Math.sin(t*2.3)*.22;let dx=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft'));let dz=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));let move=new THREE.Vector3(dx,0,dz);if(move.lengthSq()>0){move.normalize();let c=Math.cos(camYaw),s=Math.sin(camYaw);let nx=move.x*c-move.z*s,nz=move.x*s+move.z*c;let speed=keys.has('shift')?11:6.4;playerPos.x+=nx*dt*speed;playerPos.z+=nz*dt*speed;avatar.rotation.y=Math.atan2(nx,nz);animatePerson(avatar,t,Math.max(.6,speed/6.4));}if(inside<0){playerPos.x=THREE.MathUtils.clamp(playerPos.x,-57,57);playerPos.z=THREE.MathUtils.clamp(playerPos.z,-54,54);buildings.forEach(b=>{let dx=Math.abs(playerPos.x-b.d.x),dz=Math.abs(playerPos.z-b.d.z);if(dx<8.5&&dz<6.4&&!(Math.abs(playerPos.x-b.d.x)<2.2&&playerPos.z>b.d.z+4.5)){let px=8.5-dx,pz=6.4-dz;if(px<pz)playerPos.x=b.d.x+(playerPos.x>b.d.x?8.5:-8.5);else playerPos.z=b.d.z+(playerPos.z>b.d.z?6.4:-6.4)}});}else{playerPos.x=THREE.MathUtils.clamp(playerPos.x,-10.8,10.8);playerPos.z=THREE.MathUtils.clamp(playerPos.z,-10.2,10.9)}avatar.position.lerp(playerPos,.65);walkers.forEach(w=>{w.p.position[w.axis]=w[w.axis]+Math.sin(t*.65+w.t)*3.1;w.p.rotation.y=Math.cos(t*.65+w.t)>0?0:Math.PI;animatePerson(w.p,t+w.t,.5)});parkPeople.forEach((p,i)=>{p.position.x=[3,6,-5][i]+Math.sin(t*(.6+i*.18)+i)*(.8+i*.4);p.rotation.y=Math.sin(t+i)>0?0:Math.PI;animatePerson(p,t+i,.6)});parkBall.position.x=4.5+Math.sin(t*1.4)*1.4;parkBall.rotation.z=t*1.2;traffic.forEach(tr=>{tr.v.position.x=((t*5+tr.offset+58)%116)-58;tr.v.rotation.y=tr.route===37?Math.PI:0});rooms.forEach((r,i)=>{if(i!==inside)return;r.stations.forEach(st=>{let glow=st.done?'#63df91':destinations[i].color;let child=r.group.children.find(x=>x.userData.station===st.j);if(child){child.material.color.set(glow);child.position.y=2.8+Math.sin(t*2+st.j)*.14}})});const target=avatar.position.clone();target.y=1.5;let off=new THREE.Vector3(Math.sin(camYaw)*zoom*.67,zoom*.72,Math.cos(camYaw)*zoom*.67);let wanted=target.clone().add(off);camera.position.lerp(wanted,1-Math.exp(-dt*4));camera.lookAt(target);updateHint();if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)hideToast()}renderer.render(scene,camera)}avatar.position.copy(playerPos);camera.position.set(11,19,24);$('loading').remove();animate();
</script></body></html>
