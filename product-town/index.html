<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Product Town — Interactive Prototype</title><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0e1a26;color:#edf7fd;overflow:hidden}button{font:inherit;cursor:pointer}#world{width:100vw;height:100dvh;display:block;touch-action:none}#top{position:absolute;left:22px;right:22px;top:18px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:12px}.brand,.bar,.location,.prompt,.footer,.toast{background:rgba(10,24,36,.88);backdrop-filter:blur(18px);border:1px solid #54708377;box-shadow:0 12px 50px #0004;border-radius:15px}.brand{padding:13px 16px}.brand strong{display:block;letter-spacing:.08em;font-size:14px}.brand small{color:#91b3c9;font-size:11px}.bar{display:flex;align-items:center;gap:7px;padding:7px;pointer-events:auto}.bar button,.footer button,.prompt button,.modal button,.chips button{background:#21384b;color:#edfcff;border:1px solid #4c7184;border-radius:10px;padding:10px 13px;font-size:12px;font-weight:650}.bar button:hover,.footer button:hover,.prompt button:hover,.modal button:hover,.chips button:hover{background:#32607b}button:focus-visible{outline:3px solid #79e6ff;outline-offset:2px}.location{position:absolute;left:22px;bottom:22px;padding:13px 15px;max-width:300px}.location b{display:block;font-size:13px}.location span{display:block;font-size:11px;color:#b4c8d5;margin-top:5px;line-height:1.5}.prompt{position:absolute;left:50%;bottom:38px;transform:translateX(-50%);padding:9px 12px;display:none;align-items:center;gap:12px;white-space:nowrap}.prompt b{font-size:12px}.prompt button{background:#57cbd8;color:#072334;border:none}.footer{position:absolute;right:22px;bottom:22px;padding:11px 13px;font-size:11px;color:#bfd2e1}.toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);padding:10px 16px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw;text-align:center}.toast.on{opacity:1}.hidden{display:none!important}.modalWrap{position:absolute;inset:0;display:grid;place-items:center;background:#04101ccc;backdrop-filter:blur(8px);padding:16px;z-index:10}.modal{background:#132637;border:1px solid #5e839b;border-radius:22px;width:min(620px,100%);max-height:88dvh;overflow:auto;padding:25px;box-shadow:0 24px 90px #0009}.modalHead{display:flex;justify-content:space-between;align-items:center;gap:20px}.modal .eyebrow{font-size:11px;letter-spacing:.15em;color:#70cfe6;font-weight:800}.modal h1{font-size:27px;letter-spacing:-.04em;line-height:1.1;margin:10px 0}.modal p{color:#b9d2e0;font-size:14px;line-height:1.65}.modal .desc{margin-top:0}.modal .scene{background:linear-gradient(130deg,#1b4a62,#122234);border:1px solid #4a7589;border-radius:14px;min-height:115px;display:flex;justify-content:center;align-items:center;margin:18px 0;padding:22px;text-align:center;font-weight:750;color:#e8fcff}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chips button{background:#29455c}.chips button.selected{border-color:#6fecdd;background:#246b72}.response{min-height:58px;margin:10px 0;background:#091e2c;border-radius:12px;border:1px solid #305065;padding:14px;font-size:13px;line-height:1.55;color:#cce1ed}.modalActions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.modal .primary{background:#64d4d6;color:#062b36;border-color:transparent}.modal .close{padding:6px 11px}.jumpGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:16px}.jumpGrid button{text-align:left;min-height:66px}.jumpGrid span{color:#8fbbd1;font-size:11px;display:block;margin-top:4px}.touch{position:absolute;bottom:23px;left:18px;display:none;z-index:2;gap:6px;align-items:end}.dpad{display:grid;grid-template-columns:repeat(3,45px);grid-template-rows:repeat(2,45px);gap:4px}.dpad button{border-radius:12px;border:1px solid #80b0c488;background:#112b3dce;color:white;font-size:19px}.dpad button:active{background:#33748b}.dpad .up{grid-column:2;grid-row:1}.dpad .left{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:2}.dpad .right{grid-column:3;grid-row:2}.touch .act{width:65px;height:65px;border-radius:50%;border:1px solid #79dfec;background:#176072cc;color:white;font-weight:750;margin-left:9px}@media(max-width:740px),(pointer:coarse){.touch{display:flex}.location{display:none}.footer{display:none}.prompt{bottom:122px;max-width:90vw;white-space:normal}.bar{flex-wrap:wrap;justify-content:end;max-width:240px}.bar button{padding:9px 10px;font-size:11px}.brand{padding:10px}.brand strong{font-size:12px}.brand small{font-size:10px}.modal{padding:17px}.jumpGrid{grid-template-columns:1fr}.modal h1{font-size:23px}}@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style></head><body><canvas id="world" aria-label="Animated playable Product Town. Move with WASD or arrows, or use the touch controls. Approach buildings and press E to enter."></canvas><div id="top"><div class="brand"><strong>PRODUCT TOWN <span style="color:#72dbe3">●</span></strong><small>Venkata Parimi · Interactive prototype</small></div><div class="bar"><button id="jump">☷ &nbsp; Jump to project</button><button id="home">⌂ Hub</button><button id="help">? Controls</button></div></div><div class="toast" id="toast" role="status"></div><div class="location"><b id="area">Town Square</b><span>Walk with WASD or arrow keys. Hold Shift to run. Approach a building or person, then press E to interact.</span></div><div class="prompt" id="prompt"><b id="promptText"></b><button id="interact">E · Enter</button></div><div class="footer">DRAG the town to look around · SCROLL to zoom · six places · one living town</div><div class="touch"><div class="dpad"><button class="up" data-key="arrowup" aria-label="Move up">↑</button><button class="left" data-key="arrowleft" aria-label="Move left">←</button><button class="down" data-key="arrowdown" aria-label="Move down">↓</button><button class="right" data-key="arrowright" aria-label="Move right">→</button></div><button class="act" id="touchAct">ENTER</button></div><div class="modalWrap hidden" id="modalWrap"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalHead"><div class="eyebrow" id="modalEyebrow">PRODUCT TOWN</div><button class="close" id="close">✕ Close</button></div><h1 id="modalTitle">Welcome</h1><p class="desc" id="modalDesc"></p><div class="scene" id="modalScene"></div><div class="chips" id="choices"></div><div class="response" id="response" aria-live="polite"></div><div class="modalActions"><button id="tryAgain">↻ Reset scenario</button><button id="deepDive" class="primary">Read actual case study ↗</button><button id="backTown">← Return to town</button></div></div></div>
<script>
(()=>{'use strict';const canvas=document.querySelector('#world'),ctx=canvas.getContext('2d'),base='https://pvnskj.github.io/Portfolio/work/';let W=0,H=0,DPR=1,zoom=1,panX=0,panY=0,modalOpen=false,current=null,near=null,elapsed=0,last=0,toastTimer=0;const $=id=>document.getElementById(id);const town={width:1160,height:920};const player={x:552,y:456,vx:0,vy:0,dir:1};const keys=new Set();const destinations=[{id:'order',x:267,y:186,w:160,h:115,label:'CELL SERVICE',short:'Cell service store',subtitle:'Enterprise Order Management',slug:'enterprise-order-management',color:'#55b8ea',accent:'#c2f0ff',emoji:'▣',question:'A customer wants a new mobile plan. What should happen next?',opts:['Add a new plan','Change an existing plan','Inspect the dependency graph'],answers:['The order is decomposed into technical capabilities. The orchestration engine resolves dependencies before fulfillment begins.','The platform evaluates the service change without redrawing every possible fulfillment workflow.','Assessment and enrichment complete before the readiness gate allows execution.'],result:'Your product: declarative, dependency-aware enterprise order orchestration.'},{id:'rag',x:780,y:170,w:170,h:115,label:'INFORMATION',short:'Information center',subtitle:'Enterprise RAG Analysis Agent',slug:'rag-analysis-agent',color:'#aa95ed',accent:'#e7d9ff',emoji:'⌕',question:'An analyst needs evidence scattered across many documents.',opts:['Find relevant records','Check the evidence','Generate a grounded answer'],answers:['The retrieval system collects the most relevant document excerpts for the question.','A validation step checks the evidence and makes the answer auditable.','The assistant produces an evidence-grounded response instead of an unsupported guess.'],result:'Your product: an enterprise RAG investigation and analysis workflow.'},{id:'rfds',x:785,y:445,w:180,h:110,label:'PARK & SITE',short:'Community park and field site',subtitle:'RFDS / Site Engineering',slug:'rfds',color:'#7fd3b4',accent:'#dfffea',emoji:'♧',question:'A crew needs an accurate site design before work can begin.',opts:['Review site requirements','Generate design package','Validate an exception'],answers:['The team brings equipment, configuration and site information together before design.','An automated workflow prepares the engineering design documentation.','Validation and exception-handling help protect the quality of the field output.'],result:'Your product: site-engineering automation and governed field execution.'},{id:'build',x:192,y:458,w:190,h:130,label:'MRO WAREHOUSE',short:'MRO warehouse',subtitle:'Build Plus',slug:'build-plus',color:'#e9a969',accent:'#ffe9c6',emoji:'▤',question:'A technician needs a replacement part. Staff cannot locate it.',opts:['Search the catalog','Locate inventory','Dispatch the part'],answers:['Standardized item data replaces fragmented descriptions and makes the part identifiable.','The asset and inventory systems expose the item’s location and available stock.','An integrated fulfillment workflow connects requests, stock and field operations.'],result:'Your product: Build Plus, integrating catalog, inventory, lifecycle and fulfillment.'},{id:'lease',x:235,y:713,w:180,h:115,label:'PROPERTY OFFICE',short:'Lease and vendor office',subtitle:'Lease & Vendor Management',slug:'lease-vendor-management',color:'#ec9fb6',accent:'#ffe4ef',emoji:'⌂',question:'A contractor has finished a job and submitted an invoice.',opts:['Review vendor record','Match lease or contract','Release a validated invoice'],answers:['Vendor identity, record ownership and governance help establish who should be paid.','Contract and lease context provide controls for validating financial obligations.','Only a validated workflow proceeds toward payment and reporting.'],result:'Your product: lease-to-pay process governance at operating scale.'},{id:'gl',x:782,y:724,w:165,h:113,label:'$ ACCOUNTING',short:'Financial coding store',subtitle:'Dynamic GL Coding',slug:'gl-coding',color:'#f0ce75',accent:'#fff1c7',emoji:'$',question:'New transactions arrive from several business units.',opts:['Sort transactions','Update a coding rule','Prepare the close report'],answers:['Transactions are assigned to the proper accounting categories using configurable rules.','A governed rule change changes routing without hard-coding another integration flow.','Consistent routing and traceability help accelerate financial close and reporting.'],result:'Your product: dynamic GL coding and rule-governed financial routing.'}];
const buildings=destinations;const people=Array.from({length:19},(_,i)=>({x:90+(i*163)%940,y:100+(i*97)%700,t:i*1.41,color:['#5fd6ca','#f3c19d','#ad9be7','#f0d37e'][i%4]}));const vehicles=[{a:{x:360,y:355},b:{x:760,y:355},speed:0.000055,color:'#efbf6a',phase:0},{a:{x:605,y:145},b:{x:605,y:795},speed:0.000042,color:'#83d5ed',phase:.55},{a:{x:380,y:655},b:{x:750,y:655},speed:0.000052,color:'#f09db8',phase:.32}];function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();function iso(x,y,z=0){const scale=Math.min(W/1060,H/760)*zoom*1.13;return{x:(x-y)*.71*scale+W*.5+panX-(player.x-player.y)*.71*scale*.48,y:(x+y)*.36*scale+H*.2+panY-(player.x+player.y)*.36*scale*.48-z*scale,s:scale}}function polygon(points,color,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}function box3(x,y,w,h,height,roof,front='#33495c'){const a=iso(x,y,0),b=iso(x+w,y,0),c=iso(x+w,y+h,0),d=iso(x,y+h,0),a2=iso(x,y,height),b2=iso(x+w,y,height),c2=iso(x+w,y+h,height),d2=iso(x,y+h,height);polygon([d,c,c2,d2],front);polygon([b,c,c2,b2],'#25394b');polygon([a2,b2,c2,d2],roof,'#d7eefb');return{a,b,c,d,a2,b2,c2,d2}}function tile(x,y,w,h,color){polygon([iso(x,y),iso(x+w,y),iso(x+w,y+h),iso(x,y+h)],color)}function line(x,y,xx,yy,color,width=2){const a=iso(x,y,0.5),b=iso(xx,yy,0.5);ctx.strokeStyle=color;ctx.lineWidth=width*a.s;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}function sprite(x,y,color,scale=1){const p=iso(x,y,0),s=p.s*scale;ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(p.x,p.y+3*s,8*s,3.5*s,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=color;ctx.fillRect(p.x-4*s,p.y-24*s,8*s,14*s);ctx.fillStyle='#f7cba5';ctx.beginPath();ctx.arc(p.x,p.y-30*s,5*s,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#1e303f';ctx.lineWidth=3*s;ctx.beginPath();ctx.moveTo(p.x-2*s,p.y-10*s);ctx.lineTo(p.x-4*s,p.y);ctx.moveTo(p.x+2*s,p.y-10*s);ctx.lineTo(p.x+4*s,p.y);ctx.stroke()}function label(text,x,y,accent){const p=iso(x,y,82),s=Math.max(.7,Math.min(1.35,p.s));ctx.font=`700 ${11*s}px system-ui`;const width=ctx.measureText(text).width+22;ctx.fillStyle='#0b2635ec';ctx.beginPath();ctx.roundRect(p.x-width/2,p.y-13*s,width,22*s,6*s);ctx.fill();ctx.strokeStyle=accent;ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#f0fbff';ctx.textAlign='center';ctx.fillText(text,p.x,p.y+2*s)}function render(t){let dt=Math.min(.04,(t-last)/1000||.016);last=t;elapsed+=dt;if(!modalOpen){let dx=(keys.has('arrowright')||keys.has('d')?1:0)-(keys.has('arrowleft')||keys.has('a')?1:0),dy=(keys.has('arrowdown')||keys.has('s')?1:0)-(keys.has('arrowup')||keys.has('w')?1:0);let norm=Math.hypot(dx,dy)||1,speed=(keys.has('shift')?265:165);const nx=Math.max(40,Math.min(town.width-40,player.x+dx/norm*speed*dt)),ny=Math.max(40,Math.min(town.height-40,player.y+dy/norm*speed*dt));if(!buildings.some(b=>nx>b.x-14&&nx<b.x+b.w+14&&ny>b.y-14&&ny<b.y+b.h+14)){player.x=nx;player.y=ny}near=buildings.map(b=>({b,dist:Math.hypot(Math.max(b.x-player.x,0,player.x-b.x-b.w),Math.max(b.y-player.y,0,player.y-b.y-b.h))})).sort((a,b)=>a.dist-b.dist)[0];near=near?.dist<65?near.b:null;$('prompt').style.display=near?'flex':'none';if(near){$('promptText').textContent=near.short;$('interact').textContent='E · Enter';$('area').textContent=near.short}else $('area').textContent='Town Square'}ctx.clearRect(0,0,W,H);const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#234a60');grad.addColorStop(1,'#0b2031');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);tile(-70,-70,1300,1100,'#528e77');for(let x=0;x<1190;x+=85)for(let y=0;y<940;y+=85){if((x*3+y)%5<2)tile(x,y,4,4,'#74ad85')}for(const [x,y,w,h] of [[0,326,1160,75],[0,619,1160,72],[530,0,85,920],[50,0,65,920]]){tile(x,y,w,h,'#475d68');tile(x+4,y+4,w-8,h-8,'#596d76')}for(let x=55;x<1150;x+=62){line(x,362,x+25,362,'#aec9c5',1.4);line(x,655,x+25,655,'#aec9c5',1.4)}for(let y=10;y<920;y+=68)line(573,y,573,y+27,'#aec9c5',1.4);tile(425,422,235,118,'#8bbaa0');tile(443,442,198,75,'#73a88d');for(let i=0;i<7;i++){const x=425+i*25;box3(x,468,12,12,6,'#4b9665')}const elements=[];for(const b of buildings)elements.push({sort:b.x+b.y+b.w+b.h,draw:()=>{box3(b.x,b.y,b.w,b.h,52,b.color);for(let i=0;i<3;i++){const v=iso(b.x+28+i*42,b.y+b.h+1,25);ctx.fillStyle='#a9e8ec';ctx.fillRect(v.x-10*v.s,v.y-10*v.s,20*v.s,19*v.s)}const d=iso(b.x+b.w*.55,b.y+b.h+2,0);ctx.fillStyle='#72d7e5';ctx.fillRect(d.x-10*d.s,d.y-29*d.s,20*d.s,28*d.s);label(b.label,b.x+b.w*.52,b.y+b.h*.48,b.accent);if(near?.id===b.id){const p=iso(b.x+b.w/2,b.y+b.h+20);ctx.fillStyle='#8bf2e2';ctx.beginPath();ctx.arc(p.x,p.y,4+Math.sin(elapsed*5)*1.4,0,Math.PI*2);ctx.fill()}}});people.forEach((p,i)=>{let x=p.x+Math.sin(elapsed*.39+p.t)*25,y=p.y+Math.cos(elapsed*.29+p.t)*20;elements.push({sort:x+y,draw:()=>sprite(x,y,p.color,.85)})});vehicles.forEach((v,i)=>{let progress=(elapsed*v.speed*1000+v.phase)%1,u=progress<.5?progress*2:(1-progress)*2;let x=v.a.x+(v.b.x-v.a.x)*u,y=v.a.y+(v.b.y-v.a.y)*u;elements.push({sort:x+y,draw:()=>{box3(x-19,y-10,38,20,12,v.color,'#2d5565');const p=iso(x,y,18);ctx.fillStyle='#17344b';ctx.fillRect(p.x-6*p.s,p.y-6*p.s,13*p.s,7*p.s)}})});elements.push({sort:player.x+player.y+.01,draw:()=>sprite(player.x,player.y,'#50d4df',1.3)});elements.sort((a,b)=>a.sort-b.sort).forEach(e=>e.draw());requestAnimationFrame(render)}requestAnimationFrame(render);
function announce(msg){$('toast').textContent=msg;$('toast').classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('on'),2600)}function close(){modalOpen=false;$('modalWrap').classList.add('hidden');current=null}function open(b){current=b;modalOpen=true;$('modalWrap').classList.remove('hidden');$('modalEyebrow').textContent=b.subtitle;$('modalTitle').textContent=b.short;$('modalDesc').textContent=b.question;$('modalScene').textContent='▶  '+b.result;$('choices').innerHTML='';b.opts.forEach((opt,i)=>{const btn=document.createElement('button');btn.textContent=opt;btn.onclick=()=>{for(const other of $('choices').children)other.classList.remove('selected');btn.classList.add('selected');$('response').textContent=b.answers[i]};$('choices').appendChild(btn)});$('response').textContent='Choose an action to explore the product workflow. These are illustrative interactions, not live production systems.';$('deepDive').style.display='inline-block';$('deepDive').onclick=()=>window.open(base+b.slug+'/','_blank','noopener,noreferrer');$('tryAgain').onclick=()=>open(b);$('close').focus()}function showMenu(){modalOpen=true;current=null;$('modalWrap').classList.remove('hidden');$('modalEyebrow').textContent='QUICK TRAVEL';$('modalTitle').textContent='Choose your destination';$('modalDesc').textContent='Walk there yourself or teleport directly into a project scenario.';$('modalScene').textContent='Six destinations. One connected town.';$('choices').innerHTML='';destinations.forEach((b,i)=>{const btn=document.createElement('button');btn.textContent=(i+1)+'. '+b.short;btn.onclick=()=>{player.x=b.x+b.w/2;player.y=b.y+b.h+48;open(b)};$('choices').appendChild(btn)});$('response').textContent='Select any destination. Free-roam exploration remains available whenever you close this menu.';$('deepDive').style.display='none';$('tryAgain').onclick=()=>{close();player.x=552;player.y=456};$('close').focus()}$('jump').onclick=showMenu;$('home').onclick=()=>{close();player.x=552;player.y=456;panX=panY=0;announce('Returned to Town Square')};$('close').onclick=close;$('backTown').onclick=close;$('interact').onclick=()=>near&&open(near);$('touchAct').onclick=()=>near?open(near):showMenu();$('help').onclick=()=>announce('WASD / arrows: move · Shift: run · E: enter · Mouse drag: pan · Scroll: zoom · Quick travel: menu');window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='Escape'){close();return}if(modalOpen)return;keys.add(e.key.toLowerCase());if(e.key.toLowerCase()==='e'&&near)open(near);if(/^[1-6]$/.test(e.key))open(destinations[Number(e.key)-1])});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-key]').forEach(b=>{const key=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(key);b.setPointerCapture(e.pointerId)});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys.delete(key))});let dragging=false,px=0,py=0;canvas.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!dragging)return;panX+=(e.clientX-px);panY+=(e.clientY-py);px=e.clientX;py=e.clientY});canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointercancel',()=>dragging=false);canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.65,Math.min(2.3,zoom*(e.deltaY>0?.91:1.09)))},{passive:false});announce('Welcome to Product Town. Walk around or use Quick Travel!');})();
</script></body></html>
