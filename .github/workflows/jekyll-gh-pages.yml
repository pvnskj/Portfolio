name: Deploy Astro portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Rebuild approved project artwork
        run: |
          mkdir -p public/project-visuals
          cat .assets/approved-sprite.b64.0 \
              .assets/approved-sprite.b64.1 \
              .assets/approved-sprite.b64.2 \
              .assets/approved-sprite.b64.3 \
              .assets/approved-sprite.b64.4 \
              .assets/approved-sprite.b64.5 | tr -d '\n' | base64 --decode > public/project-visuals/approved-sprite.jpg
          test -s public/project-visuals/approved-sprite.jpg
          file public/project-visuals/approved-sprite.jpg

      - name: Build Astro site
        uses: withastro/action@v6

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
